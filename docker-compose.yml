# Runs the full backend stack locally: the API, a real Postgres database,
# and Redis (for caching threat-intel lookups, starting Month 3).
# This is the same shape of setup the deployed version uses — so "works
# in Docker Compose" means "works in production," not just "works on my
# machine."

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil_dev_password
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - vigil_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's DATABASE_URL to point at the 'db' service above
      # (the hostname 'db' only resolves inside the Docker network)
      DATABASE_URL: postgresql://vigil:vigil_dev_password@db:5432/vigil
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  vigil_pg_data:
